name: Deploy to Host C

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-host-c:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check required app secrets are configured
        env:
          KAMYSOFT_JWT_SECRET: ${{ secrets.KAMYSOFT_JWT_SECRET }}
          KAMYSOFT_SAAS_ADMIN_KEY: ${{ secrets.KAMYSOFT_SAAS_ADMIN_KEY }}
        run: |
          if [ ${#KAMYSOFT_JWT_SECRET} -lt 32 ]; then
            echo "::error::Add a repository secret KAMYSOFT_JWT_SECRET (32+ random characters). The server will not start without it."
            exit 1
          fi
          if [ ${#KAMYSOFT_SAAS_ADMIN_KEY} -lt 16 ]; then
            echo "::warning::KAMYSOFT_SAAS_ADMIN_KEY is not set (16+ characters); the /admin provider panel will be disabled."
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/khalilksa33/kamysoft-erp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cloudflare Tunnel Client (cloudflared)
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Set up SSH configuration for Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.SSH_PRIVATE_KEY_HOST_C }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          
          # Base SSH configuration
          cat <<EOF > ~/.ssh/config
          Host gcloud.26i.uk
              HostName gcloud.26i.uk
              User cloud
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
          EOF
          
          # Inject Cloudflare Access Service Token headers
          echo "    ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CF_CLIENT_ID_HOST_C }} --service-token-secret ${{ secrets.CF_CLIENT_SECRET_HOST_C }}" >> ~/.ssh/config

      - name: Transfer Kubernetes Manifests to Host C
        run: |
          ssh -v cloud@gcloud.26i.uk "rm -rf ~/kamysoft-erp/k8s && mkdir -p ~/kamysoft-erp/k8s"
          scp -v -r k8s/* gcloud.26i.uk:~/kamysoft-erp/k8s/

      - name: Deploy via Host C k8s Cluster
        run: |
          ssh -v cloud@gcloud.26i.uk 'echo "${{ secrets.HOST_C_SUDO_PASS }}" | sudo -S sh -c "
            if [ -f /etc/kubernetes/admin.conf ]; then
              export KUBECONFIG=/etc/kubernetes/admin.conf
            elif [ -f /etc/rancher/k3s/k3s.yaml ]; then
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            elif [ -f /root/.kube/config ]; then
              export KUBECONFIG=/root/.kube/config
            fi
            kubectl --insecure-skip-tls-verify --validate=false create secret generic cloudflare-secrets --from-literal=CF_API_TOKEN=\"${{ secrets.CF_API_TOKEN }}\" --from-literal=CF_ACCOUNT_ID=\"${{ secrets.CF_ACCOUNT_ID }}\" --from-literal=CF_TUNNEL_ID=\"${{ secrets.CF_TUNNEL_ID }}\" --dry-run=client -o yaml | kubectl --insecure-skip-tls-verify --validate=false apply -f -
            kubectl --insecure-skip-tls-verify --validate=false create secret generic kamysoft-erp-secrets --from-literal=JWT_SECRET=\"${{ secrets.KAMYSOFT_JWT_SECRET }}\" --from-literal=SAAS_ADMIN_KEY=\"${{ secrets.KAMYSOFT_SAAS_ADMIN_KEY }}\" --from-literal=SMTP_PASS=\"${{ secrets.KAMYSOFT_SMTP_PASS }}\" --dry-run=client -o yaml | kubectl --insecure-skip-tls-verify --validate=false apply -f -
            kubectl --insecure-skip-tls-verify --validate=false apply -f /home/cloud/kamysoft-erp/k8s/
            kubectl --insecure-skip-tls-verify rollout restart deployment/kamysoft-erp
            kubectl --insecure-skip-tls-verify rollout status deployment/mongodb --timeout=90s || true
            kubectl --insecure-skip-tls-verify rollout status deployment/kamysoft-erp --timeout=90s || true
          "'



