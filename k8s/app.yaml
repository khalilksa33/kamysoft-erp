apiVersion: v1
kind: ConfigMap
metadata:
  name: kamysoft-erp-config
  labels:
    app: kamysoft-erp
data:
  PORT: "8089"
  MONGO_URI: "mongodb://mongodb:27017/kamysoft-erp"
  # demo.26i.uk / 26i.uk serve the public demo store (the "default" store), whose login
  # page offers demo / demo123. This creates the demo logins for that store only;
  # logins are bound to their store, so they cannot open any customer's store.
  SEED_DEMO_USERS: "true"
  # Outgoing Email (dynapulsar.com via Hostinger SMTP)
  SMTP_HOST: "smtp.hostinger.com"
  SMTP_PORT: "465"
  SMTP_USER: "info@dynapulsar.com"
  EMAIL_FROM: "SME Solutions <info@dynapulsar.com>"
---
# The "kamysoft-erp-secrets" Secret (JWT_SECRET, SAAS_ADMIN_KEY, SMTP_PASS) is NOT stored in
# this repository. The deploy workflow creates it from the GitHub Actions secrets
# KAMYSOFT_JWT_SECRET, KAMYSOFT_SAAS_ADMIN_KEY, and KAMYSOFT_SMTP_PASS. To create it by hand:
#   kubectl create secret generic kamysoft-erp-secrets \
#     --from-literal=JWT_SECRET="<48+ random chars>" \
#     --from-literal=SAAS_ADMIN_KEY="<random key>" \
#     --from-literal=SMTP_PASS="<dynapulsar.com mailbox password>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamysoft-erp
  labels:
    app: kamysoft-erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kamysoft-erp
  template:
    metadata:
      labels:
        app: kamysoft-erp
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: kamysoft-erp
          image: ghcr.io/khalilksa33/kamysoft-erp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8089
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: kamysoft-erp-config
                  key: PORT
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: kamysoft-erp-config
                  key: MONGO_URI
            - name: SEED_DEMO_USERS
              valueFrom:
                configMapKeyRef:
                  name: kamysoft-erp-config
                  key: SEED_DEMO_USERS
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: kamysoft-erp-config
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: kamysoft-erp-config
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                configMapKeyRef:
                  name: kamysoft-erp-config
                  key: SMTP_USER
                  optional: true
            - name: EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: kamysoft-erp-config
                  key: EMAIL_FROM
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: kamysoft-erp-secrets
                  key: SMTP_PASS
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kamysoft-erp-secrets
                  key: JWT_SECRET
            - name: SAAS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: kamysoft-erp-secrets
                  key: SAAS_ADMIN_KEY
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-secrets
                  key: CF_API_TOKEN
                  optional: true
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-secrets
                  key: CF_ACCOUNT_ID
                  optional: true
            - name: CF_TUNNEL_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-secrets
                  key: CF_TUNNEL_ID
                  optional: true
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kamysoft-erp
  labels:
    app: kamysoft-erp
spec:
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: 30184
      protocol: TCP
      name: http
  selector:
    app: kamysoft-erp
  type: NodePort
